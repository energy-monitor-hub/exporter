# Dev override: run with
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml watch
# (or `npm run stack:dev`).
#
# - src/ changes are synced into the container; `tsx watch` restarts the process.
# - package.json / package-lock.json / tsconfig.json / Dockerfile changes rebuild the image.
services:
  exporter:
    # always built locally (dev target), never tagged as the ghcr image
    image: ecoflow-exporter:dev
    pull_policy: build
    build:
      target: dev
    restart: "no"
    environment:
      UPDATER_URL: ""
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../package-lock.json
        - action: rebuild
          path: ../tsconfig.json
        - action: rebuild
          path: ../Dockerfile

  # a dev exporter is built from source: nothing to install
  updater:
    profiles: ["updater"]

  # docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml run --rm --service-ports login
  login:
    image: ecoflow-exporter:dev
    pull_policy: build
    build:
      target: dev
    command: ["npx", "tsx", "src/login.ts"]
