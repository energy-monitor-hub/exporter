name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # npm-pin: npm
  NPM_VERSION: 11.21.2

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
      # npm 10 (bundled with Node 22) ignores min-release-age (.npmrc)
      - run: npm install -g "npm@${NPM_VERSION}"
      # Exact versions, lockfile in sync, every locked package older than 7 days
      - run: node scripts/check-deps.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run packs -- check
      - run: npm run packs -- release-check
